<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glābējs</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #8ecde0;
  color: #5a02ff;
}

h1 {
  color: #3204ff;font-size: 36px;text-align: center;
}

.noteikumi {
  background-color: #a8cdf1;
  color: #0415ff;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px solid #94a3b8;
  background-color: #f8fafc;
  box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
}

button {
  background-color: #152a3f;
  color: #7ed9e9;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Glābējs</h1>
<p>Spēles mērķis ir izglābt princesi.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Punktus iegūst izglābjot princesi.</p>
  <p>Spēle beidzas, kad izglābj princesi un atskan uzvaras skaņa.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="attēli/varonis.png.png" alt="Glābējs" width="128">
  <p>Skaņas efekta nozīme spēlē ir pabeigta:</p>
  <audio controls src="skaņas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">izglābt princesi</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
